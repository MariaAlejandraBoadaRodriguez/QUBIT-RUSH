name: android-emulator

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The runner presets ANDROID_HOME to its own SDK; pin ours so setup,
      # Gradle and the Godot editor settings all use the same, cached SDK.
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot, templates and Android SDK
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/tools
            ~/.local/share/godot/export_templates
            ~/android-sdk
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: env-${{ runner.os }}-${{ hashFiles('scripts/setup-env.sh', 'android/plugins/qubitrush-ads/**/*.gradle') }}

      - name: Set up environment (Godot, export templates, Android SDK)
        run: |
          bash scripts/setup-env.sh
          echo "$HOME/tools" >> "$GITHUB_PATH"

      - name: Import project
        run: ~/tools/godot --headless --path . --import

      - name: Compile all scripts
        run: bash tools/check_scripts.sh

      - name: Unit, integration and UI tests (GUT)
        run: |
          set -o pipefail
          timeout 1200 ~/tools/godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit 2>&1 | tee reports/gut-output.txt
          ! grep -E "SCRIPT ERROR" reports/gut-output.txt

      - name: Level solvability check
        run: |
          set -o pipefail
          timeout 600 ~/tools/godot --headless --path . -s tests/check_levels.gd 2>&1 | tee reports/level-check-output.txt

      - name: Build Android plugin and install Gradle template
        run: |
          bash scripts/install-android-template.sh
          bash scripts/build-android-plugin.sh

      - name: Export debug APK
        run: |
          mkdir -p build
          timeout 1800 ~/tools/godot --headless --path . --export-debug "Android" build/qubit-rush-debug.apk 2>&1 | tee build/export-debug.log
          test -s build/qubit-rush-debug.apk
          sha256sum build/qubit-rush-debug.apk | tee build/qubit-rush-debug.apk.sha256
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" dump badging build/qubit-rush-debug.apk | grep -E "^package|sdkVersion|targetSdk|native-code|uses-permission"

      - name: Upload APK and test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-and-test
          path: |
            build/*.apk
            build/*.sha256
            build/export-debug.log
            reports/

  emulator:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [36, 26]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          name: build-and-test
          path: artifact

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ci/emulator-smoke.sh artifact/build/qubit-rush-debug.apk emulator-api${{ matrix.api-level }}

      - name: Upload screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: emulator-api${{ matrix.api-level }}
          path: emulator-api${{ matrix.api-level }}/
